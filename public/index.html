<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FriendCall</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>

<!-- ═══ REGISTER SCREEN ═══ -->
<div id="screen-register" class="screen active">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="14" fill="#25D366"/>
          <path d="M20 17.5c-.3-.15-1.8-.9-2.1-1-.3-.1-.5-.15-.7.15-.2.3-.8 1-1 1.2-.18.2-.37.22-.67.07A8.4 8.4 0 0 1 13 16.1a8.1 8.1 0 0 1-1.7-2.5c-.18-.3 0-.47.13-.62.14-.14.3-.37.45-.56.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.08-.15-.7-1.7-.96-2.33-.25-.6-.5-.52-.7-.53h-.6c-.2 0-.52.07-.8.38C8.87 9.25 8 10.1 8 11.8s1.26 3.44 1.44 3.68c.17.23 2.5 3.8 6.05 5.33.85.36 1.5.58 2.02.74.85.27 1.62.23 2.23.14.68-.1 2.1-.86 2.4-1.7.3-.83.3-1.55.2-1.7-.1-.14-.3-.22-.6-.37z" fill="white"/>
        </svg>
      </div>
      <span class="brand-name">FriendCall</span>
    </div>
    <h2>Get started</h2>
    <p class="sub">Enter your phone number to register</p>
    <div class="field">
      <label>Your name</label>
      <input id="reg-name" type="text" placeholder="e.g. Rahul Shah" maxlength="30"/>
    </div>
    <div class="field">
      <label>Phone number</label>
      <div class="phone-row">
        <span class="country-code">+91</span>
        <input id="reg-phone" type="tel" placeholder="9876543210" maxlength="10"/>
      </div>
    </div>
    <button id="reg-btn" class="btn-green">Register →</button>
    <p class="note">Your number is used as your ID — no OTP needed for this demo</p>
  </div>
</div>

<!-- ═══ MAIN APP ═══ -->
<div id="screen-app" class="screen">

  <!-- LEFT: contacts sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="my-profile">
        <div class="avatar" id="my-avatar"></div>
        <div>
          <div class="my-name" id="my-name"></div>
          <div class="my-phone" id="my-phone"></div>
        </div>
      </div>
      <button id="add-contact-btn" class="btn-icon-round" title="Add contact">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </button>
    </div>

    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="Search contacts…"/>
    </div>

    <ul id="contacts-list" class="contacts-list">
      <li class="empty-contacts">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <p>No contacts yet.<br/>Click + to add a friend.</p>
      </li>
    </ul>
  </aside>

  <!-- RIGHT: chat area -->
  <main class="chat-area" id="chat-area">
    <!-- Empty state -->
    <div class="chat-empty" id="chat-empty">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>Select a contact to start chatting</p>
    </div>

    <!-- Chat header (shown when contact selected) -->
    <div class="chat-header hidden" id="chat-header">
      <div class="chat-contact-info">
        <div class="avatar sm" id="chat-avatar"></div>
        <div>
          <div class="chat-contact-name" id="chat-contact-name"></div>
          <div class="chat-contact-status" id="chat-contact-status"></div>
        </div>
      </div>
      <div class="chat-actions">
        <button class="action-btn" id="voice-call-btn" title="Voice call">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.62 3.38 2 2 0 0 1 3.6 1.21h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6.29 6.29l.98-.98a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </button>
        <button class="action-btn" id="video-call-btn" title="Video call">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages hidden" id="messages"></div>

    <!-- Typing -->
    <div class="typing-bar hidden" id="typing-bar"></div>

    <!-- Input -->
    <div class="input-bar hidden" id="input-bar">
      <textarea id="msg-input" placeholder="Type a message…" rows="1" maxlength="2000"></textarea>
      <button id="send-btn" class="btn-send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </main>
</div>

<!-- ═══ ADD CONTACT MODAL ═══ -->
<div id="modal-add" class="modal-bg hidden">
  <div class="modal">
    <div class="modal-title">Add Contact</div>
    <div class="field">
      <label>Enter their phone number</label>
      <div class="phone-row">
        <span class="country-code">+91</span>
        <input id="add-phone-input" type="tel" placeholder="9876543210" maxlength="10"/>
      </div>
    </div>
    <div id="add-result" class="add-result"></div>
    <div class="modal-btns">
      <button id="cancel-add-btn" class="btn-outline">Cancel</button>
      <button id="search-btn" class="btn-green">Search</button>
    </div>
  </div>
</div>

<!-- ═══ INCOMING CALL MODAL ═══ -->
<div id="modal-call" class="modal-bg hidden">
  <div class="modal call-modal">
    <div class="call-avatar" id="inc-avatar"></div>
    <div class="call-name" id="inc-name"></div>
    <div class="call-type-label" id="inc-type"></div>
    <div class="call-modal-btns">
      <button id="btn-reject" class="call-btn reject">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07C9.44 17.29 7.76 15.66 6.58 14a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 5.48 3h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L9.5 10.9a16 16 0 0 0 3.41 2.41z"/>
          <line x1="23" y1="1" x2="1" y2="23"/>
        </svg>
        Decline
      </button>
      <button id="btn-accept" class="call-btn accept">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.62 3.38 2 2 0 0 1 3.6 1.21h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6.29 6.29l.98-.98a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        Accept
      </button>
    </div>
  </div>
</div>

<!-- ═══ ACTIVE CALL OVERLAY ═══ -->
<div id="call-overlay" class="call-overlay hidden">
  <div class="call-screen">
    <div class="remote-wrap">
      <video id="remote-video" autoplay playsinline></video>
      <div class="audio-avatar hidden" id="audio-avatar"></div>
    </div>
    <video id="local-video" autoplay playsinline muted></video>
    <div class="call-info">
      <div class="call-peer-name" id="call-peer-name"></div>
      <div class="call-status-text" id="call-status-text">Calling…</div>
    </div>
    <div class="call-controls">
      <button class="ctrl" id="btn-mute" title="Mute">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="ctrl" id="btn-cam" title="Camera">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>
      <button class="ctrl hangup" id="btn-hangup" title="End call">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07C9.44 17.29 7.76 15.66 6.58 14a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 5.48 3h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L9.5 10.9a16 16 0 0 0 3.41 2.41z"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
      </button>
      <button class="ctrl" id="btn-spk" title="Speaker">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/rtc.js"></script>
<script src="js/app.js"></script>
</body>
</html>
